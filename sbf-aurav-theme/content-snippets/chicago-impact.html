<!-- Chicago Projects page: paste into an HTML card in place of chicago-sept.jpg.
     Edit the numbers here after each food packing event. -->
<div class="sbf-impact">
  <div class="sbf-impact-head">
    <p class="t-eyebrow">2026 Chicago food drive impact</p>
    <p class="sbf-impact-total"><span class="t-stat">{{stats.chicago_meals}}</span> <span>meals</span></p>
  </div>
  <ul class="sbf-impact-list">
    <li><span class="t-stat">{{stats.sandwiches}}</span><span class="t-small">Peanut butter sandwiches</span></li>
    <li><span class="t-stat">{{stats.brown_bags}}</span><span class="t-small">Brown bags with sandwiches, chips, granola bars and more</span></li>
    <li><span class="t-stat">{{stats.weekend_bags}}</span><span class="t-small">Bags with non-perishable items</span></li>
  </ul>
  <p class="sbf-impact-note">{{stats.period}}</p>
</div>
